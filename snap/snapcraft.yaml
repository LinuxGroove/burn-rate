name: burn-rate
title: "Burn Rate"
adopt-info: burn-rate
base: core24
summary: One button to fly, three lanes to dodge in. Jetpack through a tower.
description: |
  Burn Rate is a jetpack runner through a downtown tower at night. You're
  the test pilot at Kestrel Lift, the startup on floor 41 that just ran out
  of money, and the security contractor has come for the prototypes. So
  you put one on and leave: through the labs, the server halls and the
  robot bay, out of a window and across the city.

  - Hold to fly, let go to fall, and flick between three lanes of the
    building: zappers, lasers, seekers, drones and blast doors
  - Fly close for Burn: near misses build it up to x5, and it goes faster
    and pays more the higher it gets
  - Six prototype jetpacks, each flying its own way, and four robots to
    ride
  - Missions and ranks, the Daily Flight, thirty Courses with medals and
    ghosts, and Classic: one lane and one button
  - Last One Flying: a party race for 2 to 4 on one screen, and up to
    eight over the local network or online
  - A calm camera: no shake, no zoom, with Reduce flashing and Calm
    background settings
  - Made for controllers and handhelds, fully playable with a keyboard
    and mouse
icon: icon.png
grade: stable
confinement: strict
compression: lzo
license: MIT AND CC0-1.0 AND Apache-2.0
website: https://github.com/LinuxGroove/burn-rate
source-code: https://github.com/LinuxGroove/burn-rate
issues: https://github.com/LinuxGroove/burn-rate/issues

platforms:
  amd64:
  arm64:

apps:
  burn-rate:
    command: bin/burn-rate
    extensions: [gnome]
    plugs:
      - audio-playback
      - joystick
      - network

parts:
  burn-rate:
    plugin: nil
    source: .
    build-packages:
      - curl
      - unzip
      - ca-certificates
      - libfontconfig1
    stage-packages:
      - libasound2t64
      - libpulse0
      - libdecor-0-0
      - libfontconfig1
      - libudev1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0
      - libx11-6
      - libxcursor1
      - libxext6
      - libxi6
      - libxinerama1
      - libxrandr2
      - libxrender1
      - libdbus-1-3
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)"
    override-build: |
      # Godot version used to export; keep in step with the project.
      GODOT_VERSION=4.7.2
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) ARCH=x86_64; PRESET=Linux ;;
        arm64) ARCH=arm64; PRESET="Linux ARM64" ;;
        *) echo "Unsupported architecture: $CRAFT_ARCH_BUILD_FOR"; exit 1 ;;
      esac
      BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
      curl -sSfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.${ARCH}.zip"
      curl -sSfL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
      unzip -o -q godot.zip
      GODOT="$PWD/Godot_v${GODOT_VERSION}-stable_linux.${ARCH}"
      export HOME="$PWD/.home"
      TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      mkdir -p "$TEMPLATES"
      unzip -o -q -j templates.tpz "templates/linux_release.${ARCH}" templates/version.txt -d "$TEMPLATES"
      "$GODOT" --headless --path . --import
      mkdir -p "$CRAFT_PART_INSTALL/game" "$CRAFT_PART_INSTALL/bin"
      "$GODOT" --headless --path . --export-release "$PRESET" "$CRAFT_PART_INSTALL/game/burn-rate"
      test -f "$CRAFT_PART_INSTALL/game/burn-rate.pck"
      install -m 755 snap/local/burn-rate "$CRAFT_PART_INSTALL/bin/"
      cp LICENSE CREDITS.md "$CRAFT_PART_INSTALL/game/"
